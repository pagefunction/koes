packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
  - "projects/*"
  - "oss/*"
  - "infra"

allowBuilds:
  # Install-time code exec — do not extend without review.
  core-js-pure: false
  dtrace-provider: false
  esbuild: true
  fallow: true
  lefthook: true
  protobufjs: false
  re2: false
  workerd: true

catalog:
  "@types/node": 24.19.4
  alchemy: 2.0.0-beta.87
  typescript: 7.1.0-beta

catalogs:
  effect:
    "@effect/platform-node": 4.1.5
    effect: 4.1.5
