#cloud-config

# Why :: Tailscale-only access; no public SSH, Hetzner Console/VNC is break-glass.
disable_root: true
ssh_pwauth: false

users:
  - name: <USERNAME>
    groups: users, sudo
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    ssh_authorized_keys:
      - <SSH_PUBLIC_KEY>

package_update: true
package_upgrade: true

packages:
  - tailscale
  - ufw
  - unattended-upgrades

