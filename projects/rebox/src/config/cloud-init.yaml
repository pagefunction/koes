write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      # Why :: Defense-in-depth; sshd is disabled/masked, but if enabled via console it stays hardened and tailnet-only.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      MaxAuthTries 2
      LoginGraceTime 20
      AllowUsers <USERNAME>
      AllowTcpForwarding no
      X11Forwarding no
      AllowAgentForwarding no
      PermitTunnel no
      PrintMotd no

  - path: /etc/systemd/system/ssh.service.d/tailscale-only.conf
    content: |
      # Why :: Even if sshd is manually enabled, restrict it to Tailscale address ranges only.
      [Service]
      IPAddressDeny=any
      IPAddressAllow=100.64.0.0/10
      IPAddressAllow=fd7a:115c:a1e0::/48

runcmd:
  # Why :: Timeout guards against cloud-init stalls; remaining hardening still runs on failure (Console/VNC is break-glass).
  # Note :: Use a short-lived, preauthorized, appropriately scoped Tailscale auth key; avoid reusable unrestricted keys in user-data.
  - timeout 30s tailscale up --auth-key=<TAILSCALE_AUTH_KEY> --ssh --hostname=box || echo "tailscale up failed; continuing for Console/VNC break-glass"
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 41641/udp
  - ufw allow in on tailscale0
  - ufw --force enable
  # Why :: Ubuntu 24.04 uses ssh.socket activation; mask both socket and service.
  - systemctl daemon-reload
  - systemctl disable --now ssh.socket ssh.service || true
  - systemctl mask ssh.socket ssh.service || true
  - systemctl enable --now unattended-upgrades
